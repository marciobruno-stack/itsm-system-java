<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827;font-size:13px}</style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Actors -->
  <text x="30" y="40" font-weight="bold">Utilizador</text>
  <text x="250" y="40" font-weight="bold">Controller</text>
  <text x="480" y="40" font-weight="bold">TicketService</text>
  <text x="700" y="40" font-weight="bold">AssignmentService</text>

  <!-- Lifelines -->
  <line x1="80" y1="50" x2="80" y2="200" stroke="#cbd5e0" stroke-dasharray="4 2"/>
  <line x1="300" y1="50" x2="300" y2="200" stroke="#cbd5e0" stroke-dasharray="4 2"/>
  <line x1="520" y1="50" x2="520" y2="200" stroke="#cbd5e0" stroke-dasharray="4 2"/>
  <line x1="740" y1="50" x2="740" y2="200" stroke="#cbd5e0" stroke-dasharray="4 2"/>

  <!-- Messages -->
  <path d="M100 80 L280 80" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="72" fill="#2b6cb0">POST /api/tickets</text>

  <path d="M320 110 L500 110" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="102" fill="#2b6cb0">createTicket()</text>

  <path d="M540 140 L720 140" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="132" fill="#2b6cb0">assignTechnician()</text>

  <path d="M720 160 L520 160" stroke="#805ad5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="172" fill="#805ad5">chosenTechnician</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

</svg>