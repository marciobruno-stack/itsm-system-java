# ============================================
# SERVER
# ============================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# DATABASE - PostgreSQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/itsm_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=itsm_user
spring.datasource.password=itsm_password

# ============================================
# JPA - PostgreSQL (deixar o Hibernate criar as tabelas)
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true

# ============================================
# SQL INIT - DESATIVADO (para não usar schema.sql)
# ============================================
spring.sql.init.mode=never

# ============================================
# JWT
# ============================================
# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ============================================
# LOGGING
# ============================================
logging.level.com.itsm.incidentmanagement=DEBUG
logging.level.com.itsm.incidentmanagement.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.hibernate.SQL=DEBUG

logging.file.name=logs/itsm.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# ============================================
# THYMELEAF
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics

# application.properties
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
springdoc.override-with-generic-response=false

# Desativar cache para desenvolvimento
springdoc.api-docs.cache.disabled=true

# Configuração de pacotes a escanear
springdoc.packages-to-scan=com.itsm.incidentmanagement.controller