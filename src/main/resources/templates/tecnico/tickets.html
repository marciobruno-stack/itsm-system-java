<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .status-badge { font-size: 12px; padding: 5px 12px; border-radius: 20px; }
        .priority-high { background-color: #dc3545; color: white; }
        .priority-medium { background-color: #ffc107; color: #212529; }
        .priority-low { background-color: #28a745; color: white; }
        .priority-critical { background-color: #6f42c1; color: white; }
        .table-hover tbody tr:hover { background-color: rgba(13, 110, 253, 0.05); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <span class="navbar-text text-white">
                <i class="bi bi-ticket"></i> Tickets
                <span class="badge bg-light text-dark ms-2" th:text="${tickets.size()}">0</span>
            </span>
        <a href="/utilizador/new-ticket" class="btn btn-success btn-sm">
            <i class="bi bi-plus-circle"></i> Novo Ticket
        </a>
    </div>
</nav>

<div class="container mt-4">
    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" id="filterEstado" onchange="filterTickets()">
                        <option value="todos">Todos</option>
                        <option value="ABERTO">ABERTO</option>
                        <option value="ATRIBUIDO">ATRIBUIDO</option>
                        <option value="EM_CURSO">EM_CURSO</option>
                        <option value="RESOLVIDO">RESOLVIDO</option>
                        <option value="FECHADO">FECHADO</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Prioridade</label>
                    <select class="form-select" id="filterPrioridade" onchange="filterTickets()">
                        <option value="todos">Todas</option>
                        <option value="BAIXA">BAIXA</option>
                        <option value="MEDIA">MEDIA</option>
                        <option value="ALTA">ALTA</option>
                        <option value="CRITICA">CRITICA</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Pesquisar</label>
                    <input type="text" class="form-control" id="filterSearch" placeholder="Título..." onkeyup="filterTickets()">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-secondary w-100" onclick="resetFilters()">
                        <i class="bi bi-arrow-counterclockwise"></i> Limpar Filtros
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela de Tickets -->
    <div class="card">
        <div class="card-header bg-white">
            <h5 class="mb-0"><i class="bi bi-list-ul"></i> Todos os Tickets</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="ticketTable">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Estado</th>
                        <th>Prioridade</th>
                        <th>Técnico</th>
                        <th>Aberto por</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tickets}" class="ticket-row"
                        th:data-estado="${t.estado}"
                        th:data-prioridade="${t.prioridade}"
                        th:data-titulo="${#strings.toLowerCase(t.titulo)}">
                        <td><strong th:text="${t.id}">1</strong></td>
                        <td th:text="${t.titulo}">Problema de rede</td>
                        <td>
                                    <span class="status-badge"
                                          th:class="${t.estado == 'ABERTO' ? 'bg-warning text-dark' :
                                                     t.estado == 'ATRIBUIDO' ? 'bg-info text-white' :
                                                     t.estado == 'EM_CURSO' ? 'bg-primary text-white' :
                                                     t.estado == 'RESOLVIDO' ? 'bg-success text-white' : 'bg-secondary text-white'}"
                                          th:text="${t.estado}">ABERTO</span>
                        </td>
                        <td>
                                    <span class="badge"
                                          th:class="${t.prioridade == 'CRITICA' ? 'priority-critical' :
                                                     t.prioridade == 'ALTA' ? 'priority-high' :
                                                     t.prioridade == 'MEDIA' ? 'priority-medium' : 'priority-low'}"
                                          th:text="${t.prioridade}">ALTA</span>
                        </td>
                        <td th:text="${t.tecnico != null ? t.tecnico.utilizador.nome : '-'}">João</td>
                        <td th:text="${t.abertoPor.nome}">Carlos</td>
                        <td th:text="${#temporals.format(t.dataAbertura, 'dd/MM/yyyy')}">01/01/2024</td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="'/admin/tickets/' + ${t.id}">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a class="btn btn-sm btn-outline-danger" th:href="'/admin/tickets/delete/' + ${t.id}"
                               onclick="return confirm('Confirmar remoção?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white">
            <small class="text-muted">
                <span th:text="${tickets.size()}">0</span> tickets no total
            </small>
        </div>
    </div>
</div>

<script>
    function filterTickets() {
        const estado = document.getElementById('filterEstado').value;
        const prioridade = document.getElementById('filterPrioridade').value;
        const search = document.getElementById('filterSearch').value.toLowerCase();

        const rows = document.querySelectorAll('.ticket-row');
        rows.forEach(row => {
            const rowEstado = row.dataset.estado;
            const rowPrioridade = row.dataset.prioridade;
            const rowTitulo = row.dataset.titulo;

            let show = true;
            if (estado !== 'todos' && rowEstado !== estado) show = false;
            if (prioridade !== 'todos' && rowPrioridade !== prioridade) show = false;
            if (search && !rowTitulo.includes(search)) show = false;

            row.style.display = show ? '' : 'none';
        });
    }

    function resetFilters() {
        document.getElementById('filterEstado').value = 'todos';
        document.getElementById('filterPrioridade').value = 'todos';
        document.getElementById('filterSearch').value = '';
        filterTickets();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
