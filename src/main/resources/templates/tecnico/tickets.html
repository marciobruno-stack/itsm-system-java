<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM - Meus Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%); color: white; padding: 20px 0; }
        .sidebar .brand { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand h3 { color: #ecf0f1; font-weight: 300; }
        .sidebar .brand h3 span { color: #3498db; font-weight: 600; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 25px; border-radius: 8px; margin: 5px 10px; transition: all 0.3s; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar .nav-link.active { background: #3498db; color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .main-content { padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .card-header { background: white; border-bottom: 1px solid #eef2f7; padding: 20px 25px; border-radius: 12px 12px 0 0 !important; }
        .table th { border-top: none; color: #6c757d; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .stats-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .stats-card .number { font-size: 2rem; font-weight: 700; color: #2c3e50; }
        .stats-card .label { color: #6c757d; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stats-card .icon { font-size: 2.5rem; opacity: 0.2; float: right; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <div class="brand">
                <h3>ITSM</h3>
                <small style="color: #bdc3c7;">Gestão de Incidentes</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/tecnico/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/tecnico/tickets"><i class="fas fa-ticket-alt"></i> Meus Tickets</a></li>
                <li class="nav-item mt-4"><a class="nav-link" href="/logout" style="color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Meus Tickets</h2>
                    <p class="text-muted">Tickets atribuídos a <strong th:text="${username}">Técnico</strong></p>
                </div>
                <div>
                    <a href="/tecnico/dashboard" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="icon"><i class="fas fa-ticket-alt"></i></div>
                        <div class="number" th:text="${totalTickets}">0</div>
                        <div class="label">Total</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="icon"><i class="fas fa-clock"></i></div>
                        <div class="number" th:text="${abertos}">0</div>
                        <div class="label">Em Aberto</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="icon"><i class="fas fa-check-circle"></i></div>
                        <div class="number" th:text="${resolvidos}">0</div>
                        <div class="label">Resolvidos</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h5 class="mb-0">Tickets Atribuídos</h5></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th><th>Título</th><th>Estado</th><th>Prioridade</th><th>Aberto Por</th><th>Data</th><th>Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${tickets == null or tickets.isEmpty()}">
                                <td colspan="7" class="text-center py-4">
                                    <i class="fas fa-inbox fa-2x text-muted mb-2 d-block"></i>
                                    <span class="text-muted">Nenhum ticket atribuído</span>
                                </td>
                            </tr>
                            <tr th:each="ticket : ${tickets}">
                                <td><span class="badge bg-secondary" th:text="${ticket.id}"></span></td>
                                <td th:text="${ticket.titulo}"></td>
                                <td>
                                    <span class="badge" th:class="${ticket.estado == 'ABERTO' ? 'bg-warning' : ticket.estado == 'ATRIBUIDO' ? 'bg-info' : ticket.estado == 'EM_CURSO' ? 'bg-primary' : ticket.estado == 'RESOLVIDO' ? 'bg-success' : 'bg-secondary'}" th:text="${ticket.estado}"></span>
                                </td>
                                <td>
                                    <span class="badge" th:class="${ticket.prioridade == 'CRITICA' ? 'bg-danger' : ticket.prioridade == 'ALTA' ? 'bg-warning' : ticket.prioridade == 'MEDIA' ? 'bg-info' : 'bg-secondary'}" th:text="${ticket.prioridade}"></span>
                                </td>
                                <td th:text="${ticket.abertoPor != null ? ticket.abertoPor.nome : 'N/A'}"></td>
                                <td th:text="${#temporals.format(ticket.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <form th:action="@{/tecnico/tickets/update-state}" method="post" class="d-inline">
                                        <input type="hidden" name="ticketId" th:value="${ticket.id}">
                                        <select name="estado" class="form-select form-select-sm d-inline-block w-auto">
                                            <option value="ABERTO" th:selected="${ticket.estado == 'ABERTO'}">ABERTO</option>
                                            <option value="ATRIBUIDO" th:selected="${ticket.estado == 'ATRIBUIDO'}">ATRIBUIDO</option>
                                            <option value="EM_CURSO" th:selected="${ticket.estado == 'EM_CURSO'}">EM CURSO</option>
                                            <option value="RESOLVIDO" th:selected="${ticket.estado == 'RESOLVIDO'}">RESOLVIDO</option>
                                            <option value="FECHADO" th:selected="${ticket.estado == 'FECHADO'}">FECHADO</option>
                                        </select>
                                        <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-sync"></i></button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
