<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tickets - ITSM</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f4f4f4; }
        .header { background: #1a237e; color: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .header a { color: white; margin: 0 10px; text-decoration: none; }
        .btn { background: #1a237e; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-danger { background: #d32f2f; }
        .btn-success { background: #2e7d32; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 5px; overflow: hidden; }
        th { background: #34495e; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f5f5; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .actions a { margin: 0 5px; padding: 5px 10px; border-radius: 3px; text-decoration: none; color: white; font-size: 12px; }
        .actions .delete { background: #d32f2f; }
        .actions .edit { background: #f57c00; }
        .badge { padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: 600; }
        .badge-ABERTO { background: #ffcdd2; color: #b71c1c; }
        .badge-EM_ANDAMENTO { background: #fff3e0; color: #e65100; }
        .badge-RESOLVIDO { background: #c8e6c9; color: #1b5e20; }
        .badge-CRITICA { background: #d32f2f; color: white; }
        .badge-ALTA { background: #f57c00; color: white; }
        .badge-MEDIA { background: #fdd835; color: #333; }
        .badge-BAIXA { background: #388e3c; color: white; }
        .alert-success { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .actions form { display: inline; }
        .actions select { padding: 5px; border-radius: 3px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 ITSM - Gestão de Infraestruturas</h1>
        <div>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/users">Utilizadores</a>
            <a href="/admin/technicians">Técnicos</a>
            <a href="/admin/tickets">Tickets</a>
        </div>
    </div>

    <div class="container">
        <div class="toolbar">
            <h2>🎫 Tickets</h2>
            <a href="/admin/tickets/new" class="btn">+ Novo Ticket</a>
        </div>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Estado</th>
                    <th>Prioridade</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="'#' + ${ticket.id}">#1</td>
                    <td th:text="${ticket.titulo}">Ticket</td>
                    <td><span class="badge" th:classappend="'badge-' + ${ticket.estado}" th:text="${ticket.estado}">ABERTO</span></td>
                    <td><span class="badge" th:classappend="'badge-' + ${ticket.prioridade}" th:text="${ticket.prioridade}">ALTA</span></td>
                    <td th:text="${ticket.dataAbertura}">28/06/2024</td>
                    <td class="actions">
                        <form th:action="'/admin/tickets/' + ${ticket.id} + '/update-state'" method="post">
                            <select name="estado" onchange="this.form.submit()">
                                <option value="ABERTO" th:selected="${ticket.estado == 'ABERTO'}">Aberto</option>
                                <option value="EM_ANDAMENTO" th:selected="${ticket.estado == 'EM_ANDAMENTO'}">Em Andamento</option>
                                <option value="RESOLVIDO" th:selected="${ticket.estado == 'RESOLVIDO'}">Resolvido</option>
                            </select>
                        </form>
                        <a th:href="'/admin/tickets/delete/' + ${ticket.id}" class="delete" onclick="return confirm('Tem certeza?')">Remover</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
