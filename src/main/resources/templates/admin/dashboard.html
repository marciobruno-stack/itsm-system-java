<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - ITSM</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #f0f2f5; }
        .header { background: #1a237e; color: white; padding: 20px; }
        .menu a { color: white; margin: 0 15px; text-decoration: none; }
        .menu a:hover { text-decoration: underline; }
        .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; min-width: 150px; flex: 1; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #1a237e; }
        .card { background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #e8eaf6; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; display: inline-block; }
        .badge-ABERTO { background: #ffcdd2; color: #b71c1c; }
        .badge-EM_ANDAMENTO { background: #fff3e0; color: #e65100; }
        .badge-RESOLVIDO { background: #c8e6c9; color: #1b5e20; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ITSM - Gestao de Infraestruturas</h1>
        <div class="menu">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/users">Utilizadores</a>
            <a href="/admin/technicians">Tecnicos</a>
            <a href="/admin/tickets">Tickets</a>
            <a href="/admin/competencias">Competecias</a>
        </div>
    </div>

    <div class="container">
        <h2>Bem-vindo, <span th:text="${username}">Admin</span>!</h2>

        <div class="stats">
            <div class="stat-card"><h3>Total Tickets</h3><div class="number" th:text="${totalTickets}">0</div></div>
            <div class="stat-card"><h3>Tickets Abertos</h3><div class="number" th:text="${ticketsAbertos}">0</div></div>
            <div class="stat-card"><h3>Tecnicos</h3><div class="number" th:text="${totalTecnicos}">0</div></div>
            <div class="stat-card"><h3>Utilizadores</h3><div class="number" th:text="${totalUsers}">0</div></div>
            <div class="stat-card"><h3>Competecias</h3><div class="number" th:text="${totalCompetencias}">0</div></div>
        </div>

        <div class="card">
            <h2>Tickets Recentes</h2>
            <table>
                <tr>
                    <th>ID</th><th>Titulo</th><th>Estado</th><th>Prioridade</th>
                </tr>
                <tr th:each="t : ${recentTickets}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.titulo}">Ticket</td>
                    <td><span class="badge" th:classappend="${'badge-' + t.estado}" th:text="${t.estado}">ABERTO</span></td>
                    <td th:text="${t.prioridade}">ALTA</td>
                </tr>
            </table>
            <p th:if="${recentTickets.empty}">Nenhum ticket registado.</p>
        </div>
    </div>
</body>
</html>
