<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM - Novo Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%); color: white; padding: 20px 0; }
        .sidebar .brand { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand h3 { color: #ecf0f1; font-weight: 300; }
        .sidebar .brand h3 span { color: #3498db; font-weight: 600; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 25px; border-radius: 8px; margin: 5px 10px; transition: all 0.3s; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar .nav-link.active { background: #3498db; color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .main-content { padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .card-header { background: white; border-bottom: 1px solid #eef2f7; padding: 20px 25px; border-radius: 12px 12px 0 0 !important; }
        .form-label { font-weight: 600; }
        .required::after { content: " *"; color: #e74c3c; }
        .alert { border-radius: 10px; border: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <div class="brand">
                <h3>ITSM</h3>
                <small style="color: #bdc3c7;">Gestão de Incidentes</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/tickets"><i class="fas fa-ticket-alt"></i> Tickets</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/users"><i class="fas fa-users"></i> Utilizadores</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/technicians"><i class="fas fa-user-cog"></i> Técnicos</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/competencias"><i class="fas fa-tasks"></i> Competências</a></li>
                <li class="nav-item mt-4"><a class="nav-link" href="/logout" style="color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Novo Ticket</h2>
                    <p class="text-muted">Crie um novo ticket no sistema como administrador</p>
                </div>
                <div>
                    <a href="/admin/tickets" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</a>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span></div>

            <div class="card">
                <div class="card-header"><h5 class="mb-0"><i class="fas fa-plus-circle"></i> Dados do Ticket</h5></div>
                <div class="card-body">
                    <form th:action="@{/admin/tickets}" method="post" th:object="${ticket}">
                        <div class="mb-3">
                            <label class="form-label required">Título</label>
                            <input type="text" class="form-control" th:field="*{titulo}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required">Descrição</label>
                            <textarea class="form-control" th:field="*{descricao}" rows="4" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label required">Prioridade</label>
                                <select class="form-select" th:field="*{prioridade}" required>
                                    <option value="BAIXA">Baixa</option>
                                    <option value="MEDIA">Média</option>
                                    <option value="ALTA">Alta</option>
                                    <option value="CRITICA">Crítica</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label required">Tipo</label>
                                <select class="form-select" th:field="*{tipo}" required>
                                    <option value="INCIDENTE">Incidente</option>
                                    <option value="PEDIDO">Pedido</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label required">Aberto por</label>
                                <select class="form-select" name="abertoPorId" required>
                                    <option value="">Selecione o criador</option>
                                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.nome} + ' (' + ${user.username} + ')'"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Técnico (opcional)</label>
                                <select class="form-select" name="tecnicoId">
                                    <option value="">Atribuição automática</option>
                                    <option th:each="tecnico : ${tecnicos}" th:value="${tecnico.id}" th:text="${tecnico.utilizador.nome}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/admin/tickets" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Criar Ticket</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
