<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Utilizadores - ITSM</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f4f4f4; }
        .header { background: #1a237e; color: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .header a { color: white; margin: 0 10px; text-decoration: none; }
        .header a:hover { text-decoration: underline; }
        .btn { background: #1a237e; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-danger { background: #d32f2f; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 5px; overflow: hidden; }
        th { background: #34495e; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f5f5; }
        .badge { padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: 600; }
        .badge-ADMIN { background: #d32f2f; color: white; }
        .badge-TECNICO { background: #1976d2; color: white; }
        .badge-UTILIZADOR { background: #388e3c; color: white; }
        .alert-success { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .actions a { margin: 0 5px; padding: 5px 10px; border-radius: 3px; text-decoration: none; color: white; font-size: 12px; }
        .actions .delete { background: #d32f2f; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 ITSM - Gestão de Infraestruturas</h1>
        <div>
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/users">Utilizadores</a>
            <a href="/admin/technicians">Técnicos</a>
            <a href="/admin/tickets">Tickets</a>
        </div>
    </div>

    <div class="container">
        <div class="toolbar">
            <h2>👥 Utilizadores</h2>
            <a href="/admin/users/new" class="btn">+ Novo Utilizador</a>
        </div>

        <div th:if="${success}" class="alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.username}">admin</td>
                    <td th:text="${user.nome}">Admin</td>
                    <td th:text="${user.email}">admin@itsm.com</td>
                    <td><span class="badge" th:classappend="'badge-' + ${user.role}" th:text="${user.role}">ADMIN</span></td>
                    <td class="actions">
                        <a th:href="'/admin/users/delete/' + ${user.id}" class="delete" onclick="return confirm('Tem certeza?')">Remover</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
