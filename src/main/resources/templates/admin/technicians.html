<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITSM - Técnicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%); color: white; padding: 20px 0; }
        .sidebar .brand { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .brand h3 { color: #ecf0f1; font-weight: 300; }
        .sidebar .brand h3 span { color: #3498db; font-weight: 600; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 12px 25px; border-radius: 8px; margin: 5px 10px; transition: all 0.3s; }
        .sidebar .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .sidebar .nav-link.active { background: #3498db; color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .main-content { padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .card-header { background: white; border-bottom: 1px solid #eef2f7; padding: 20px 25px; border-radius: 12px 12px 0 0 !important; }
        .table th { border-top: none; color: #6c757d; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .btn-action { padding: 5px 10px; margin: 0 2px; border-radius: 6px; font-size: 0.85rem; }
        .alert { border-radius: 10px; border: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <div class="brand">
                <h3>ITSM</h3>
                <small style="color: #bdc3c7;">Gestão de Incidentes</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/tickets"><i class="fas fa-ticket-alt"></i> Tickets</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/users"><i class="fas fa-users"></i> Utilizadores</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/technicians"><i class="fas fa-user-cog"></i> Técnicos</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/competencias"><i class="fas fa-tasks"></i> Competências</a></li>
                <li class="nav-item mt-4"><a class="nav-link" href="/logout" style="color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Técnicos</h2>
                    <p class="text-muted">Gerencie os técnicos do sistema</p>
                </div>
                <div>
                    <a href="/admin/technicians/new" class="btn btn-primary"><i class="fas fa-plus"></i> Novo Técnico</a>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header"><h5 class="mb-0">Lista de Técnicos</h5></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th><th>Nome</th><th>Carga</th><th>Competências</th><th class="text-center">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="tec : ${technicians}">
                                <td th:text="${tec.id}"></td>
                                <td th:text="${tec.utilizador != null ? tec.utilizador.nome : 'N/A'}"></td>
                                <td><span class="badge bg-warning text-dark" th:text="${tec.cargaTrabalhoAtual}">0</span></td>
                                <td><span class="badge bg-secondary" th:text="${tec.competencias != null ? tec.competencias.size() : 0}">0</span></td>
                                <td class="text-center">
                                    <a th:href="@{/admin/technicians/delete/{id}(id=${tec.id})}" class="btn btn-sm btn-outline-danger btn-action" onclick="return confirm('Remover este técnico?')"><i class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${technicians == null or technicians.isEmpty()}">
                                <td colspan="5" class="text-center py-4">
                                    <i class="fas fa-user-cog fa-2x text-muted mb-2 d-block"></i>
                                    <p class="text-muted">Nenhum técnico registado</p>
                                    <a href="/admin/technicians/new" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Criar primeiro técnico</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <small class="text-muted">Total: <strong th:text="${technicians != null ? technicians.size() : 0}"></strong> técnicos</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
